<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accès protégé</title>
<style>:root{--bg:#12131a;--panel:#1b1d28;--text:#e8e6de;--muted:#8b8fa3;--gold:#c9a227;--err:#d9534f;--line:#2c2f40}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:Georgia,serif;padding:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px 28px;width:100%;max-width:360px;text-align:center}
h1{font-weight:400;font-size:1.15rem;margin:0 0 20px;color:var(--muted)}
input{width:100%;background:#20222f;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-family:ui-monospace,monospace;font-size:.9rem;margin-bottom:14px}
button{width:100%;background:var(--gold);color:#1a1500;border:none;border-radius:4px;padding:11px;font-family:Georgia,serif;font-size:.95rem;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#m{min-height:18px;font-size:.8rem;color:var(--err);margin-top:10px;font-family:ui-monospace,monospace}
</style></head><body>

const LK="_sg_lock";
function b64(s){const b=atob(s);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function st(){const j=localStorage.getItem(LK);return j?JSON.parse(j):{fails:0,until:0}}
function sv(o){localStorage.setItem(LK,JSON.stringify(o))}
function delay(n){return Math.min(60,Math.pow(2,Math.max(0,n-2)))*1000}
async function tryPass(pwd){
  const salt=b64(S),iv=b64(I),data=b64(D);
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  return new TextDecoder().decode(plain);
}
const inp=document.getElementById('p'),btn=document.getElementById('b'),msg=document.getElementById('m');
function lockCheck(){
  const s=st();
  const rem=s.until-Date.now();
  if(rem>0){
    btn.disabled=true;
    msg.textContent='Trop d\'essais. Réessayez dans '+Math.ceil(rem/1000)+'s.';
    setTimeout(lockCheck,1000);
  } else { btn.disabled=false; }
}
lockCheck();
async function attempt(){
  const s=st();
  if(s.until>Date.now())return;
  btn.disabled=true; msg.style.color='var(--muted)'; msg.textContent='Vérification…';
  try{
    const html=await tryPass(inp.value);
    sv({fails:0,until:0});
    document.open();document.write(html);document.close();
  }catch(e){
    s.fails=(s.fails||0)+1;
    s.until=Date.now()+delay(s.fails);
    sv(s);
    msg.style.color='var(--err)';
    msg.textContent='Mot de passe incorrect.';
    inp.value='';
    lockCheck();
  }
}
btn.addEventListener('click',attempt);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')attempt()});
